      .animate-float { animation: float 6s ease-in-out infinite; }
      
      .fade-in-up { opacity: 0; transform: translateY(40px) perspective(1000px) rotateX(-10deg); transition: opacity 1s cubic-bezier(0.19, 1, 0.22, 1), transform 1s cubic-bezier(0.19, 1, 0.22, 1); }

      // --- HOOKS ---
      const { useState, useEffect, useRef, useCallback } = React;

      const useOnScreen = (options) => {
        const ref = useRef(null);
        const [isIntersecting, setIntersecting] = useState(false);
        useEffect(() => {
          const observer = new IntersectionObserver(([entry]) => { if (entry.isIntersecting) setIntersecting(true); }, options);
          const currentRef = ref.current;
          if (currentRef) observer.observe(currentRef);
          return () => { if (currentRef) observer.unobserve(currentRef); };
        }, []);
        return [ref, isIntersecting];
      };

      // --- CONSTANTS ---

        try {
          const savedData = localStorage.getItem(key);
          return savedData ? JSON.parse(savedData) : defaultValue;

      const MagicWandIcon = ({ className }) => (<svg xmlns="http://www.w3.org/2000/svg" className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M20.71,9.29,19,7.58,16.42,5,18.13,3.29a1,1,0,0,0,0-1.42,1,1,0,0,0-1.41,0L15,3.58,12.42,1,10.71,2.71a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0L13.83,2.42l2,2L14.12,6.12a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0L17.24,5.83l2,2L17.58,9.54a1,1,0,0,0,0,1.41,1,1,0,0,0,1.41,0L20.71,9.29ZM19.24,14.5a3.47,3.47,0,0,1-2.47.75,3.45,3.45,0,0,1-2.47-1,1,1,0,0,0-1.42,0,1,1,0,0,0,0,1.41,5.46,5.46,0,0,0,7.78,0,1,1,0,0,0-1.42-1.41ZM7.48,10.5a3.49,3.49,0,0,1,0-5,1,1,0,0,0-1.42-1.41,5.49,5.49,0,0,0,0,7.78,1,1,0,0,0,1.42,0,1,1,0,0,0,0-1.41A3.41,3.41,0,0,1,7.48,10.5ZM12,19.34a.84.84,0,0,1-.59-.24L8.5,16.19a3.25,3.25,0,0,1,0-4.6l.7-.71a1,1,0,0,0-1.41-1.41l-.71.71a5.25,5.25,0,0,0,0,7.42l2.92,2.91a.84.84,0,0,1-.59,1.43H3.84a1,1,0,0,0,0,2H8.54a2.83,2.83,0,0,0,2-4.82l.85-.85a1,1,0,1,0-1.41-1.41l-.85.85a.86.86,0,0,1-1.15.34.81.81,0,0,1-.6-.57,1,1,0,0,0-1-.78,1,1,0,0,0-1,.78.81.81,0,0,1-.6.57.86.86,0,0,1-1.15-.34L3,14.3a1,1,0,0,0-1.41,1.41L3,17.12a3.25,3.25,0,0,1,0,4.6l2.91,2.92a.84.84,0,0,1,.59.24.84.84,0,0,1,.59-.24l2.91-2.92a3.25,3.25,0,0,1,0-4.6l-.7-.71a1,1,0,0,0-1.41,1.41l.7.71a1.25,1.25,0,0,0,1.77,0l2.91-2.92a1.25,1.25,0,0,0,0-1.77L13.18,12.4a1,1,0,1,0-1.41,1.41l2.35,2.35a3.25,3.25,0,0,1,0,4.6Z"/></svg>);

      // --- COMPONENTS ---
      
      const Header = ({ personalInfo, navLinks }) => {
        const [scrolled, setScrolled] = useState(false);
        const [activeSection, setActiveSection] = useState('');

        useEffect(() => {
          const handleScroll = () => {
            setScrolled(window.scrollY > 10);
            const sections = document.querySelectorAll('section[id]');
            let currentSection = '';
            sections.forEach(section => {
              const sectionTop = section.offsetTop;
              if (window.scrollY >= sectionTop - 100) {
                currentSection = section.getAttribute('id') || '';
              }
            });
            setActiveSection(currentSection);
          };
          window.addEventListener('scroll', handleScroll);
          return () => window.removeEventListener('scroll', handleScroll);
        }, []);

        return (
          <header className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${scrolled ? 'bg-bg-glass backdrop-blur-lg border-b border-border-color' : 'bg-transparent'}`}>
            <nav className="container mx-auto px-6 py-4 flex justify-between items-center">
              <a href="#" className="text-2xl font-bold bg-gradient-accent text-gradient font-heading">
                {personalInfo.name.split(' ')[0][0]}{personalInfo.name.split(' ')[1][0]}
              </a>
              <ul className="hidden md:flex items-center space-x-8">
                {navLinks.map((link) => (

                      {link.name}
                      <span className={`absolute left-0 -bottom-1 w-full h-0.5 bg-accent-primary transform transition-transform duration-300 ${activeSection === link.href.substring(1) ? 'scale-x-100' : 'scale-x-0'}`}></span>
                    </a>
                  </li>
                ))}
              </ul>
            </nav>
          </header>
        );
      };

      const Hero = ({ personalInfo }) => {
        const [ref, isVisible] = useOnScreen({ threshold: 0.3 });
        const mountRef = useRef(null);

        useEffect(() => {
          if (!mountRef.current) return;
          
          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          mountRef.current.appendChild(renderer.domElement);

          const geometry = new THREE.IcosahedronGeometry(2, 1);
          const material = new THREE.MeshStandardMaterial({
              color: 0xaa00ff,
              emissive: 0x3a005f,
              metalness: 0.9,
              roughness: 0.1,
              wireframe: true,
          });
          const crystal = new THREE.Mesh(geometry, material);
          scene.add(crystal);
          
          const light1 = new THREE.PointLight(0x00f6ff, 2);
          light1.position.set(5, 5, 5);
          scene.add(light1);
          
          const light2 = new THREE.PointLight(0xd400ff, 2);
          light2.position.set(-5, -5, -5);
          scene.add(light2);
          
          camera.position.z = 5;
          
          const mouse = new THREE.Vector2();
          const onMouseMove = (event) => {
              mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
              mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
          };
          window.addEventListener('mousemove', onMouseMove);

          const animate = () => {
              requestAnimationFrame(animate);
              crystal.rotation.x += 0.001;
              crystal.rotation.y += 0.001;
              camera.position.x += (mouse.x * 2 - camera.position.x) * 0.02;
              camera.position.y += (mouse.y * 2 - camera.position.y) * 0.02;
              camera.lookAt(scene.position);
              renderer.render(scene, camera);
          };
          animate();

          const handleResize = () => {
              camera.aspect = window.innerWidth / window.innerHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(window.innerWidth, window.innerHeight);
          }
          window.addEventListener('resize', handleResize);

          return () => {
              window.removeEventListener('mousemove', onMouseMove);
              window.removeEventListener('resize', handleResize);
              mountRef.current?.removeChild(renderer.domElement);
          };
        }, []);


        return (
          <section id="home" className="relative min-h-screen flex items-center justify-center overflow-hidden bg-bg-primary">
            <div id="hero-canvas" ref={mountRef}></div>
            <div className="absolute inset-0 bg-gradient-to-br from-bg-primary via-bg-secondary to-purple-900/50 opacity-50"></div>

              <div className={`text-center md:text-left transition-all duration-1000 ${isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'}`}>
                <span className="text-accent-primary font-semibold text-lg">Hello, I'm</span>
                <h1 className="text-5xl lg:text-7xl font-extrabold text-white my-3 font-heading">

                </h1>
                <h2 className="text-2xl lg:text-3xl font-semibold bg-gradient-accent text-gradient mb-8">
                  {personalInfo.title}
                </h2>
                <div className="flex justify-center md:justify-start gap-4">

                    Get In Touch
                  </a>
                  <a href={personalInfo.linkedin} target="_blank" rel="noopener noreferrer" className="text-white bg-transparent border-2 border-accent-primary hover:bg-accent-primary/20 focus:ring-4 focus:outline-none focus:ring-cyan-300/50 font-medium rounded-lg text-base px-6 py-3 text-center transition-all duration-300 flex items-center gap-2">
                    <LinkedInIcon className="w-5 h-5"/> LinkedIn
                  </a>
                </div>
              </div>
              <div className="relative hidden md:flex justify-center items-center h-[500px]">
                <div className="relative group animate-float">
                  <div className="absolute -inset-1 bg-gradient-accent rounded-full blur-xl opacity-60 group-hover:opacity-100 transition duration-1000 group-hover:duration-200"></div>
                  <img src={personalInfo.profileImageUrl} alt="Sairam Mashetty" className="relative w-72 h-72 lg:w-80 lg:w-80 rounded-full object-cover border-4 border-bg-secondary" />
                </div>
              </div>
            </div>
          </section>
        );
      };
      
      const Section = ({ id, title, titleAccent, children }) => {
        const [ref, isVisible] = useOnScreen({ threshold: 0.1 });
        return (

      };
      
      const About = ({ personalInfo, educationData }) => {
          const [ref, isVisible] = useOnScreen({ threshold: 0.3 });
          return (
            <Section id="about" title="About" titleAccent="Me">
              <p ref={ref} className={`max-w-3xl mx-auto text-center text-text-secondary text-lg mb-16 fade-in-up ${isVisible ? 'visible' : ''}`}>
                {personalInfo.summary}
              </p>
              <div ref={ref} className={`max-w-4xl mx-auto bg-bg-glass backdrop-blur-md rounded-2xl p-8 md:p-12 shadow-2xl shadow-black/20 border border-border-color fade-in-up ${isVisible ? 'visible' : ''}`} style={{transitionDelay: '200ms'}}>
                  <div className="grid md:grid-cols-2 gap-8 items-center">
                      <div>

          const AIGenerateButton = ({ fieldKey, prompt, currentValue, onGenerated }) => (<button type="button" onClick={() => handleGenerateAI(fieldKey, prompt, currentValue, onGenerated)} disabled={isGenerating} className="ml-2 p-2 bg-gradient-accent rounded-md text-black hover:opacity-90 disabled:opacity-50 disabled:cursor-wait transition-opacity flex items-center text-sm"><MagicWandIcon className="w-4 h-4 mr-2" />{isGenerating && generatingKey === fieldKey ? '...' : 'Enhance'}</button>);
          const renderInput = (label, value, onChange, type = "text") => (<div className="mb-4"><label className="block text-slate-300 text-sm font-bold mb-2">{label}</label><input type={type} value={value} onChange={onChange} className="shadow appearance-none border rounded w-full py-2 px-3 bg-slate-700 border-slate-600 text-white leading-tight focus:outline-none focus:shadow-outline focus:border-accent-primary"/></div>);
          const renderTextarea = (label, value, onChange, aiOptions = null) => (<div className="mb-4"><div className="flex justify-between items-center mb-2"><label className="block text-slate-300 text-sm font-bold">{label}</label>{aiOptions && <AIGenerateButton {...aiOptions} />}</div><textarea value={value} onChange={onChange} rows={5} className="shadow appearance-none border rounded w-full py-2 px-3 bg-slate-700 border-slate-600 text-white leading-tight focus:outline-none focus:shadow-outline focus:border-accent-primary min-h-[120px]"/></div>);

          if (!isLoggedIn) {
            return (
                <div className="min-h-screen bg-bg-primary flex items-center justify-center">
                    <div className="max-w-sm w-full bg-bg-secondary p-8 rounded-2xl shadow-2xl shadow-black/30 border border-border-color">
                        <h2 className="text-3xl font-bold text-center text-white mb-8 font-heading">{recoveryMode ? "Password Recovery" : "Admin Login"}</h2>
                        {recoveryMode ? (
                             <form onSubmit={handleRecovery}>
                                {renderInput("Recovery Phrase", recoveryAttempt, (e) => setRecoveryAttempt(e.target.value))}
                                {error && <p className="text-red-500 text-xs italic mb-4">{error}</p>}
                                <button className="bg-gradient-accent hover:bg-gradient-to-l text-black font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full transition-all duration-300" type="submit">Reset Password</button>
                                <button type="button" onClick={() => { setRecoveryMode(false); setError(''); }} className="text-center w-full mt-4 text-sm text-text-secondary hover:text-white">Back to Login</button>
                             </form>
                        ) : (
                             <form onSubmit={handleLogin}>
                                {renderInput("Password", password, (e) => setPassword(e.target.value), "password")}
                                {error && <p className="text-red-500 text-xs italic mb-4">{error}</p>}
                                <button className="bg-gradient-accent hover:bg-gradient-to-l text-black font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full transition-all duration-300" type="submit">Sign In</button>
                                <button type="button" onClick={() => { setRecoveryMode(true); setError(''); }} className="text-center w-full mt-4 text-sm text-text-secondary hover:text-white">Forgot Password?</button>
                            </form>
                        )}
                    </div>
                </div>
            );
          }
          
          const tabs = [ { id: 'sections', label: 'Manage Sections' }, { id: 'personal', label: 'Personal Info' }, { id: 'experience', label: 'Experience' }, { id: 'skills', label: 'Skills' }, { id: 'awards', label: 'Awards' }, { id: 'projects', label: 'Projects' }, { id: 'certifications', label: 'Certifications' }, { id: 'articles', label: 'Articles' }, { id: 'security', label: 'Security' }];
          return (
              <div className="min-h-screen bg-bg-primary text-white flex">
                  <aside className="w-64 bg-bg-secondary p-4 border-r border-border-color flex flex-col">
                      <h1 className="text-2xl font-bold mb-8 text-center bg-gradient-accent text-gradient font-heading">Admin Panel</h1>
                      <nav className="flex flex-col space-y-2">{tabs.map(tab => (<button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`p-2 rounded-md text-left transition-colors ${activeTab === tab.id ? 'bg-accent-primary/20 text-accent-primary' : 'hover:bg-slate-700'}`}>{tab.label}</button>))}</nav>
                      <div className="mt-auto">
                           <button onClick={() => window.location.hash = ''} className="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded mb-2">View Portfolio</button>
                          <button onClick={handleLogout} className="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">Logout</button>
                      </div>
                  </aside>
                  <main className="flex-grow p-8 overflow-y-auto">
                    {activeTab === 'security' && (
                        <div>
                            <h2 className="text-3xl font-bold mb-2 text-white font-heading">Security</h2>
                            <p className="text-slate-400 mb-6">Set a secret recovery phrase to reset your password if you forget it. Store this phrase in a safe place.</p>
                            <div className="bg-bg-secondary p-6 rounded-lg border border-border-color">
                                {renderInput("Recovery Phrase", securityData.recoveryPhrase, e => setSecurityData({recoveryPhrase: e.target.value}))}
                                <p className="text-xs text-amber-400 mt-2">Warning: Changing this will invalidate your old phrase.</p>
                            </div>
                            <button onClick={() => saveData('securityData', securityData)} className="mt-6 bg-accent-primary hover:opacity-80 text-black font-bold py-2 px-4 rounded">Save Recovery Phrase</button>
                        </div>
                    )}
                    {activeTab === 'personal' && (
                        <div>
                            <h2 className="text-3xl font-bold mb-6 font-heading">Edit Personal & Education Info</h2>
                            <div className="grid md:grid-cols-2 gap-8">
                              <div className="bg-bg-secondary p-6 rounded-lg border border-border-color">
                                  <h3 className="text-xl font-semibold mb-4 text-accent-primary">Personal Details</h3>
                                  {renderInput("Name", personalInfo.name, e => setPersonalInfo({...personalInfo, name: e.target.value}))}
                                  {renderInput("Title", personalInfo.title, e => setPersonalInfo({...personalInfo, title: e.target.value}))}
                                  {renderInput("Email", personalInfo.email, e => setPersonalInfo({...personalInfo, email: e.target.value}), "email")}
                                  {renderInput("Phone", personalInfo.phone, e => setPersonalInfo({...personalInfo, phone: e.target.value}), "tel")}
                                  {renderInput("Location", personalInfo.location, e => setPersonalInfo({...personalInfo, location: e.target.value}))}
                                  {renderInput("LinkedIn URL", personalInfo.linkedin, e => setPersonalInfo({...personalInfo, linkedin: e.target.value}), "url")}
                                  {renderInput("Profile Image URL", personalInfo.profileImageUrl, e => setPersonalInfo({...personalInfo, profileImageUrl: e.target.value}), "url")}
                                  {renderTextarea("Summary", personalInfo.summary, e => setPersonalInfo({...personalInfo, summary: e.target.value}), { fieldKey: 'summary', prompt: "Rewrite this summary for a Claims Associate's portfolio.", currentValue: personalInfo.summary, onGenerated: (newText) => setPersonalInfo({...personalInfo, summary: newText})})}
                                  {renderTextarea("Contact Intro", personalInfo.contactIntro, e => setPersonalInfo({...personalInfo, contactIntro: e.target.value}), { fieldKey: 'contactIntro', prompt: "Rewrite this contact section intro text.", currentValue: personalInfo.contactIntro, onGenerated: (newText) => setPersonalInfo({...personalInfo, contactIntro: newText})})}
                                  <button onClick={() => saveData('personalInfo', personalInfo)} className="mt-4 bg-accent-primary hover:opacity-80 text-black font-bold py-2 px-4 rounded">Save Personal</button>
                              </div>
                              <div className="bg-bg-secondary p-6 rounded-lg border border-border-color">
                                <h3 className="text-xl font-semibold mb-4 text-accent-primary">Education</h3>
                                {renderInput("Degree", educationData.degree, e => setEducationData({...educationData, degree: e.target.value}))}
                                {renderInput("Institution", educationData.institution, e => setEducationData({...educationData, institution: e.target.value}))}
                                {renderInput("Duration", educationData.duration, e => setEducationData({...educationData, duration: e.target.value}))}
                                {renderInput("GPA", educationData.gpa, e => setEducationData({...educationData, gpa: e.target.value}))}
                                <button onClick={() => saveData('educationData', educationData)} className="mt-4 bg-accent-primary hover:opacity-80 text-black font-bold py-2 px-4 rounded">Save Education</button>
                              </div>
                            </div>
                        </div>
                    )}
                    {/* Other tabs can be similarly styled and structured */}
                  </main>
              </div>
          );
      };
      
      const App = () => {
        const [isAdminView, setIsAdminView] = useState(window.location.hash === '#admin');
        const [appData, setAppData] = useState({
            personalInfo: loadData('personalInfo', personalInfoDefault), navLinks: navLinksDefault, sections: loadData('sectionsConfig', sectionsDefault), educationData: loadData('educationData', educationDataDefault), experienceData: loadData('experienceData', experienceDataDefault), skillsData: loadData('skillsData', skillsDataDefault), awardsData: loadData('awardsData', awardsDataDefault), articlesData: loadData('articlesData', articlesDataDefault), projectsData: loadData('projectsData', projectsDataDefault), certificationsData: loadData('certificationsData', certificationsDataDefault),
        });

        useEffect(() => {
          const preloader = document.getElementById('preloader');
          if (preloader) {
            window.addEventListener('load', () => { preloader.classList.add('loaded'); });
          }
          const handleHashChange = () => setIsAdminView(window.location.hash === '#admin');
          const handleStorageChange = () => {
             setAppData({
                personalInfo: loadData('personalInfo', personalInfoDefault), navLinks: navLinksDefault, sections: loadData('sectionsConfig', sectionsDefault), educationData: loadData('educationData', educationDataDefault), experienceData: loadData('experienceData', experienceDataDefault), skillsData: loadData('skillsData', skillsDataDefault), awardsData: load-data('awardsData', awardsDataDefault), articlesData: loadData('articlesData', articlesDataDefault), projectsData: loadData('projectsData', projectsDataDefault), certificationsData: loadData('certificationsData', certificationsDataDefault),
            });
          };
          window.addEventListener('hashchange', handleHashChange, false);
          window.addEventListener('storage', handleStorageChange);
          return () => { window.removeEventListener('hashchange', handleHashChange, false); window.removeEventListener('storage', handleStorageChange); };
        }, []);

        if (isAdminView) { return <Admin />; }
        
        const visibleSections = appData.sections.filter(s => s.visible);
        const sectionComponentMap = {
          about: <About personalInfo={appData.personalInfo} educationData={appData.educationData} />, experience: <Experience experienceData={appData.experienceData} />, skills: <Skills skillsData={appData.skillsData} />, awards: <Awards awardsData={appData.awardsData} />, articles: <Articles articlesData={appData.articlesData} />, projects: <Projects projectsData={appData.projectsData} />, certifications: <Certifications certificationsData={appData.certificationsData} />, contact: <Contact personalInfo={appData.personalInfo} />,
        };

        return (
          <>
            <Header personalInfo={appData.personalInfo} navLinks={appData.navLinks} />
            <main>
              <Hero personalInfo={appData.personalInfo} />
              {visibleSections.map(section => <React.Fragment key={section.id}>{sectionComponentMap[section.id]}</React.Fragment>)}
            </main>
            <Footer personalInfo={appData.personalInfo} />
            <Chatbot portfolioData={appData} />
          </>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
