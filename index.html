          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
          const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
          renderer.setSize(window.innerWidth, window.innerHeight);
          mountRef.current.appendChild(renderer.domElement);

          const geometry = new THREE.IcosahedronGeometry(2, 1);

              emissive: 0x3a005f,
              metalness: 0.9,
              roughness: 0.1,
              wireframe: true,
          });
          const crystal = new THREE.Mesh(geometry, material);
          scene.add(crystal);
          
          const light1 = new THREE.PointLight(0x00f6ff, 2);
          light1.position.set(5, 5, 5);
          scene.add(light1);
          
          const light2 = new THREE.PointLight(0xd400ff, 2);
          light2.position.set(-5, -5, -5);
          scene.add(light2);
          
          camera.position.z = 5;
          
          const mouse = new THREE.Vector2();
          const onMouseMove = (event) => {
              mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
              mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
          };
          window.addEventListener('mousemove', onMouseMove);

          const animate = () => {
              requestAnimationFrame(animate);
              crystal.rotation.x += 0.001;
              crystal.rotation.y += 0.001;
              camera.position.x += (mouse.x * 2 - camera.position.x) * 0.02;
              camera.position.y += (mouse.y * 2 - camera.position.y) * 0.02;
              camera.lookAt(scene.position);
              renderer.render(scene, camera);
          };
          animate();

          const handleResize = () => {
              camera.aspect = window.innerWidth / window.innerHeight;
              camera.updateProjectionMatrix();
              renderer.setSize(window.innerWidth, window.innerHeight);
          }
          window.addEventListener('resize', handleResize);

          return () => {

        const [formData, setFormData] = useState({ name: '', email: '', message: '' });

        const handleInputChange = (e) => {
          const { name, value } = e.target;
          setFormData(prev => ({ ...prev, [name]: value }));
        };

        const handleSubmit = async (e) => {
          e.preventDefault();
          if (!formData.name || !formData.email || !formData.message) return;
          if (!API_KEY) {
              setFormStatus({ status: 'error', message: 'Contact form is currently disabled. Please reach out via email directly.' });
              return;
          }
          setFormStatus({ status: 'submitting', message: '' });

          try {
            const ai = new GoogleGenAI({ apiKey: API_KEY });
            
            const sendEmailDeclaration = { name: 'send_email', parameters: { type: Type.OBJECT, properties: { to: { type: Type.STRING }, from_name: { type: Type.STRING }, from_email: { type: Type.STRING }, message: { type: Type.STRING } }, required: ['to', 'from_name', 'from_email', 'message'] } };
            const sendSmsDeclaration = { name: 'send_sms', parameters: { type: Type.OBJECT, properties: { to_phone: { type: Type.STRING }, from_name: { type: Type.STRING }, message: { type: Type.STRING } }, required: ['to_phone', 'from_name', 'message'] } };
            
            const targetPhone = personalInfo.notificationPhone || personalInfo.phone;
            const prompt = `A user, ${formData.name} (${formData.email}), has submitted the following message through the portfolio contact form: "${formData.message}". The portfolio owner, ${personalInfo.name}, has requested to be notified via ${personalInfo.notificationMethod}. Please call the appropriate function to send this notification. The owner's email is ${personalInfo.email} and their phone number is ${targetPhone}.`;

            const response = await ai.models.generateContent({
              model: 'gemini-2.5-flash',
              contents: prompt,
              config: { tools: [{ functionDeclarations: [sendEmailDeclaration, sendSmsDeclaration] }] },
            });

            const functionCall = response.functionCalls && response.functionCalls[0];
            if (functionCall) {
                if (functionCall.name === 'send_email') {
                    setFormStatus({ status: 'success', message: `Thank you! Your message has been sent, and ${personalInfo.name.split(' ')[0]} will be notified by email.` });
                } else if (functionCall.name === 'send_sms') {
                    setFormStatus({ status: 'success', message: `Thank you! Your message has been sent, and ${personalInfo.name.split(' ')[0]} will be notified by SMS.` });
                } else {
                    setFormStatus({ status: 'success', message: "Thank you for your message! I'll get back to you shortly." });
                }
            } else {
              throw new Error("AI did not return a function call.");
            }
          } catch (error) {
            console.error("Gemini Function Call Error:", error);
            setFormStatus({ status: 'error', message: "Sorry, something went wrong. Please try again or email me directly." });
          }
        };

        const resetForm = () => {
          setFormData({ name: '', email: '', message: '' });
          setFormStatus({ status: 'idle', message: '' });
        };

        return (
          <Section id="contact" title="Contact" titleAccent="Me">
            <div ref={ref} className={`max-w-5xl mx-auto grid md:grid-cols-2 gap-12 bg-bg-glass backdrop-blur-lg p-8 md:p-12 rounded-2xl shadow-2xl border border-border-color fade-in-up ${isVisible ? 'visible' : ''}`}>

                   <a href={`tel:${personalInfo.phone}`} className="flex items-center space-x-4 group"><PhoneIcon className="w-6 h-6 text-accent-primary group-hover:scale-110 transition-transform"/><span className="text-text-primary group-hover:text-white transition-colors">{personalInfo.phone}</span></a>

                                        {renderInput(`Source URL`, item.sourceUrl, e => handleItemChange(setProjectsData, index, 'sourceUrl', e.target.value))}
                                        {renderTextarea(`Description`, item.description, e => handleItemChange(setProjectsData, index, 'description', e.target.value))}

                        </div>

                    {activeTab === 'certifications' && (
                        <div>
                            <h2 className="text-3xl font-bold mb-6 font-heading">Edit Certifications</h2>
                             <div className="space-y-6">
                                {certificationsData.map((item, index) => (
                                    <div key={item.id || index} className="bg-bg-secondary p-6 rounded-lg border border-border-color relative">
                                        <button onClick={() => handleRemoveItem(setCertificationsData, index)} className="absolute top-4 right-4 btn-admin-close"><CloseIcon className="w-6 h-6" /></button>
                                        <h3 className="text-lg font-semibold text-accent-primary mb-2">Certification #{index + 1}</h3>
                                        {renderInput(`Name`, item.name, e => handleItemChange(setCertificationsData, index, 'name', e.target.value))}
                                        {renderInput(`Issuer`, item.issuer, e => handleItemChange(setCertificationsData, index, 'issuer', e.target.value))}

                                        <ImageInput label="Certification/Logo Image" imageUrl={item.imageUrl} onUrlChange={e => handleItemChange(setCertificationsData, index, 'imageUrl', e.target.value)} onFileChange={async e => handleItemChange(setCertificationsData, index, 'imageUrl', await fileToBase64(e.target.files[0]))} onAiEdit={() => openAiModal(item.imageUrl, (newImg) => handleItemChange(setCertificationsData, index, 'imageUrl', newImg))} showImageToggle={true} isImageShown={!!item.showImage} onImageToggleChange={e => handleItemChange(setCertificationsData, index, 'showImage', e.target.checked)} />
                                    </div>
                                ))}
                            </div>
                            <button onClick={() => handleAddItem(setCertificationsData, { name: '', issuer: '', date: '', credentialUrl: '', imageUrl: '', showImage: true })} className="mt-6 btn-admin btn-admin-success">Add Certification</button>
                            <button onClick={() => saveData('certificationsData', certificationsData)} className="mt-6 ml-4 btn-admin btn-admin-primary">Save Certifications</button>
                        </div>
                    )}
                    {activeTab === 'articles' && (
                        <div>
                            <h2 className="text-3xl font-bold mb-6 font-heading">Edit Articles</h2>
                             <div className="space-y-6">
                                {articlesData.map((item, index) => (
                                    <div key={item.id || index} className="bg-bg-secondary p-6 rounded-lg border border-border-color relative">
                                        <button onClick={() => handleRemoveItem(setArticlesData, index)} className="absolute top-4 right-4 btn-admin-close"><CloseIcon className="w-6 h-6" /></button>
                                        <h3 className="text-lg font-semibold text-accent-primary mb-2">Article #{index + 1}</h3>
                                        {renderInput(`Title`, item.title, e => handleItemChange(setArticlesData, index, 'title', e.target.value))}

                                        <ImageInput label="Article Image" imageUrl={item.imageUrl} onUrlChange={e => handleItemChange(setArticlesData, index, 'imageUrl', e.target.value)} onFileChange={async e => handleItemChange(setArticlesData, index, 'imageUrl', await fileToBase64(e.target.files[0]))} onAiEdit={() => openAiModal(item.imageUrl, (newImg) => handleItemChange(setArticlesData, index, 'imageUrl', newImg))} showImageToggle={true} isImageShown={!!item.showImage} onImageToggleChange={e => handleItemChange(setArticlesData, index, 'showImage', e.target.checked)} />
                                        {renderInput(`Link`, item.link, e => handleItemChange(setArticlesData, index, 'link', e.target.value))}
                                        {renderTextarea(`Description`, item.description, e => handleItemChange(setArticlesData, index, 'description', e.target.value))}
                                    </div>
                                ))}
                            </div>
                            <button onClick={() => handleAddItem(setArticlesData, { title: '', description: '', imageUrl: 'https://picsum.photos/seed/new-article/600/400', showImage: true, category: '', link: '#' })} className="mt-6 btn-admin btn-admin-success">Add Article</button>
                            <button onClick={() => saveData('articlesData', articlesData)} className="mt-6 ml-4 btn-admin btn-admin-primary">Save Articles</button>
                        </div>
                    )}
                    {activeTab === 'security' && (

                                label="Recovery Method"
                                name="recoveryMethod"
                                value={securityData.recoveryMethod || 'phrase'}
                                onChange={e => setSecurityData(prev => ({ ...prev, recoveryMethod: e.target.value }))}
                                options={[{label: 'Secret Phrase', value: 'phrase'}, {label: 'Security Question', value: 'question'}]}
                              />
                              {securityData.recoveryMethod === 'phrase' ? (
                                <>
                                  {renderInput("Recovery Phrase", securityData.recoveryPhrase, e => setSecurityData({...securityData, recoveryPhrase: e.target.value}))}
                                  <p className="text-xs text-amber-400 mt-2">Enter a secret phrase only you know.</p>
                                </>
                              ) : (
                                <>
                                  <div className="mb-4">
                                    <label className="block text-slate-300 text-sm font-bold mb-2">Security Question</label>

                    )}
                  </main>
              </div>
            </>
          );
      };
      
      const App = () => {
        const [isAdminView, setIsAdminView] = useState(window.location.hash === '#admin');
        const [theme, setTheme] = useState(localStorage.getItem('portfolio-theme') || 'dark');
        const [appData, setAppData] = useState({
            personalInfo: loadData('personalInfo', personalInfoDefault), navLinks: navLinksDefault, sections: loadData('sectionsConfig', sectionsDefault), educationData: loadData('educationData', educationDataDefault), experienceData: loadData('experienceData', experienceDataDefault), skillsData: loadData('skillsData', skillsDataDefault), awardsData: loadData('awardsData', awardsDataDefault), articlesData: loadData('articlesData', articlesDataDefault), projectsData: loadData('projectsData', projectsDataDefault), certificationsData: loadData('certificationsData', certificationsDataDefault),
        });

        const toggleTheme = useCallback(() => {
          setTheme(prevTheme => (prevTheme === 'dark' ? 'light' : 'dark'));
        }, []);

        useEffect(() => {
          if (theme === 'light') {
            document.documentElement.classList.add('light-theme');
          } else {
            document.documentElement.classList.remove('light-theme');
          }
          localStorage.setItem('portfolio-theme', theme);
        }, [theme]);
        
        useEffect(() => {
          const preloader = document.getElementById('preloader');
          if (preloader) {
            setTimeout(() => preloader.classList.add('loaded'), 100);
          }
          const handleHashChange = () => setIsAdminView(window.location.hash === '#admin');
          const handleStorageChange = (e) => {
              const keysToWatch = ['personalInfo', 'sectionsConfig', 'educationData', 'experienceData', 'skillsData', 'awardsData', 'articlesData', 'projectsData', 'certificationsData'];
              if (keysToWatch.includes(e.key)) {
                setAppData(prevData => ({...prevData,
                    personalInfo: loadData('personalInfo', personalInfoDefault),
                    sections: loadData('sectionsConfig', sectionsDefault),
                    educationData: loadData('educationData', educationDataDefault),
                    experienceData: loadData('experienceData', experienceDataDefault),
                    skillsData: loadData('skillsData', skillsDataDefault),
                    awardsData: loadData('awardsData', awardsDataDefault),
                    articlesData: loadData('articlesData', articlesDataDefault),
                    projectsData: loadData('projectsData', projectsDataDefault),
                    certificationsData: loadData('certificationsData', certificationsDataDefault),
                }));
             }
          };
          window.addEventListener('hashchange', handleHashChange, false);
          window.addEventListener('storage', handleStorageChange);
          return () => {
            window.removeEventListener('hashchange', handleHashChange, false);
            window.removeEventListener('storage', handleStorageChange);
          };
        }, []);

        if (isAdminView) { return <Admin />; }
        
        const visibleSections = appData.sections.filter(s => s.visible);
        const sectionComponentMap = {
          about: <About personalInfo={appData.personalInfo} educationData={appData.educationData} />, experience: <Experience experienceData={appData.experienceData} />, skills: <Skills skillsData={appData.skillsData} />, awards: <Awards awardsData={appData.awardsData} />, articles: <Articles articlesData={appData.articlesData} />, projects: <Projects projectsData={appData.projectsData} />, certifications: <Certifications certificationsData={appData.certificationsData} />, contact: <Contact personalInfo={appData.personalInfo} />,
        };

        return (
          <>
            <Header personalInfo={appData.personalInfo} navLinks={appData.navLinks} theme={theme} toggleTheme={toggleTheme} />
            <main>
              <Hero personalInfo={appData.personalInfo} />
              {visibleSections.map(section => <React.Fragment key={section.id}>{sectionComponentMap[section.id]}</React.Fragment>)}
            </main>
            <Footer personalInfo={appData.personalInfo} />
            <Chatbot portfolioData={appData} />
          </>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
