<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sairam Mashetty | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f172a;
        overflow-x: hidden;
      }
      .text-gradient { background-clip: text; -webkit-background-clip: text; color: transparent; }
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #0f172a; }
      ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #4facfe, #a18cd1); border-radius: 10px; }
      ::-webkit-scrollbar-thumb:hover { background: linear-gradient(135deg, #00f2fe, #667eea); }
      @keyframes gradient-animation { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      .animate-gradient { background-size: 200% 200%; animation: gradient-animation 15s ease infinite; }
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0px); } }
      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-float-delay-1 { animation-delay: 1s; }
      .animate-float-delay-2 { animation-delay: 2s; }
      .animate-float-delay-3 { animation-delay: 3s; }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.1); } }
      .animate-pulse-glow { animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
      .fade-in-up { opacity: 0; transform: translateY(30px); transition: opacity 0.8s ease-out, transform 0.8s ease-out; }
      .fade-in-up.visible { opacity: 1; transform: translateY(0); }
      .fade-in { opacity: 0; transition: opacity 1s ease-in; }
      .fade-in.visible { opacity: 1; }

      /* Visual Improvements */
      .bg-grid-pattern {
        background-image: radial-gradient(rgba(148, 163, 184, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
        -webkit-mask-image: linear-gradient(to bottom, black 40%, transparent 100%);
      }
      ::selection { background: rgba(6, 182, 212, 0.3); color: #fff; }
    </style>
    <!-- React and Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    "react/": "https://aistudiocdn.com/react@^19.2.0/"

}
</script>
</head>

</html>
