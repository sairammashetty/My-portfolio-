<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sairam Mashetty | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@700;800;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg-primary: #0a0918;
        --bg-secondary: #121029;
        --bg-glass: rgba(18, 16, 41, 0.5);
        --text-primary: #e0e0e0;
        --text-secondary: #a0a0c0;
        --accent-primary: #00f6ff;
        --accent-secondary: #d400ff;
        --border-color: rgba(67, 60, 119, 0.3);
        --text-primary-on-accent: #000000;
        --admin-bg-primary: #1e293b; /* slate-800 */
        --admin-bg-secondary: #334155; /* slate-700 */
        --admin-border-color: #475569; /* slate-600 */
      }
      html.light-theme {
        --bg-primary: #f4f7fc;
        --bg-secondary: #ffffff;
        --bg-glass: rgba(255, 255, 255, 0.6);
        --text-primary: #1f2937;
        --text-secondary: #4b5563;
        --accent-primary: #0891b2;
        --accent-secondary: #9333ea;
        --border-color: rgba(0, 0, 0, 0.1);
        --text-primary-on-accent: #ffffff;
        --admin-bg-primary: #e2e8f0; /* slate-200 */
        --admin-bg-secondary: #f1f5f9; /* slate-100 */
        --admin-border-color: #cbd5e1; /* slate-300 */
      }
      body {
        font-family: 'DM Sans', sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      .font-heading { font-family: 'Exo 2', sans-serif; }
      .text-gradient { background-clip: text; -webkit-background-clip: text; color: transparent; }
      .bg-gradient-accent { background-image: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); }
      
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: var(--bg-secondary); }
      ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); border-radius: 10px; }
      
      .chatbot-messages::-webkit-scrollbar { width: 6px; }
      .chatbot-messages::-webkit-scrollbar-track { background: #2a2846; }
      .chatbot-messages::-webkit-scrollbar-thumb { background: var(--accent-secondary); border-radius: 10px; }
      html.light-theme .chatbot-messages::-webkit-scrollbar-track { background: #e2e8f0; }
      
      @keyframes gradient-animation { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
      .animate-gradient { background-size: 200% 200%; animation: gradient-animation 20s ease infinite; }
      
      @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
      .animate-float { animation: float 6s ease-in-out infinite; }
      
      .fade-in-up { opacity: 0; transform: translateY(40px) perspective(1000px) rotateX(-10deg); transition: opacity 1s cubic-bezier(0.19, 1, 0.22, 1), transform 1s cubic-bezier(0.19, 1, 0.22, 1); }
      .fade-in-up.visible { opacity: 1; transform: translateY(0) perspective(1000px) rotateX(0); }

      .glow-on-hover { transition: box-shadow 0.3s ease-in-out, transform 0.3s ease-in-out; }
      .glow-on-hover:hover { transform: translateY(-2px); box-shadow: 0 0 15px var(--accent-primary), 0 0 30px var(--accent-secondary); }
      html.light-theme .glow-on-hover:hover { box-shadow: 0 0 15px rgba(8, 145, 178, 0.6), 0 0 30px rgba(147, 51, 234, 0.5); }
      
      #hero-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0.6; }
      html.light-theme #hero-canvas { opacity: 0.3; }

      .section-3d-bg { position: absolute; inset:0; z-index: 0; opacity: 0.1; }
      html.light-theme .section-3d-bg { opacity: 0.05; }

      .skill-circle-track { color: #334155; } /* slate-700 */
      html.light-theme .skill-circle-track { color: #e2e8f0; } /* slate-200 */

      #preloader { position: fixed; inset: 0; background-color: var(--bg-primary); z-index: 9999; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s ease-out; }
      #preloader.loaded { opacity: 0; pointer-events: none; }
      @keyframes preloader-spin { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(180deg) scale(1.1); } 100% { transform: rotate(360deg) scale(1); } }
      .loader-shape { width: 60px; height: 60px; border: 4px solid transparent; border-top-color: var(--accent-primary); border-right-color: var(--accent-secondary); border-radius: 50%; animation: preloader-spin 1.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite; }

      .btn-accent {
        background-image: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        color: var(--text-primary-on-accent);
      }
      
      /* Admin Panel Specific Styles */
      .admin-panel { background-color: var(--admin-bg-primary); }
      html.light-theme .admin-panel { color: #111827; }
      .admin-sidebar { background-color: var(--admin-bg-secondary); border-right-color: var(--admin-border-color); }
      html.light-theme .admin-sidebar { background-color: #ffffff; }
      .admin-card { background-color: var(--admin-bg-secondary); border-color: var(--admin-border-color); }
      html.light-theme .admin-card { background-color: #ffffff; }
      .admin-card-header { border-bottom-color: var(--admin-border-color); }
      .admin-input { background-color: var(--admin-bg-primary); border-color: var(--admin-border-color); }
      html.light-theme .admin-input { background-color: #f8fafc; border-color: #e2e8f0; }
      html.light-theme .admin-input:focus { border-color: var(--accent-primary); }
      html.light-theme .admin-label { color: #4b5563; }
      html.light-theme .admin-text { color: #374151; }

      .btn-admin { font-weight: bold; padding: 0.5rem 1rem; border-radius: 0.375rem; transition: background-color 0.2s, color 0.2s, opacity 0.2s; cursor: pointer; border: none; }
      .btn-admin:disabled { opacity: 0.6; cursor: not-allowed; }
      
      .btn-admin-primary { background-color: var(--accent-secondary); color: #fff; }
      .btn-admin-primary:hover:not(:disabled) { background-color: #a100cc; }
      html.light-theme .btn-admin-primary { background-color: var(--accent-secondary); color: #fff; }
      html.light-theme .btn-admin-primary:hover:not(:disabled) { background-color: #7e22ce; }

      .btn-admin-accent { background-color: var(--accent-primary); color: var(--text-primary-on-accent); }
      .btn-admin-accent:hover:not(:disabled) { opacity: 0.9; }

      .btn-admin-success { background-color: #16a34a; color: #fff; }
      .btn-admin-success:hover:not(:disabled) { background-color: #15803d; }

      .btn-admin-danger { background-color: #dc2626; color: #fff; }
      .btn-admin-danger:hover:not(:disabled) { background-color: #b91c1c; }

      .btn-admin-secondary { background-color: #475569; color: #fff; }
      .btn-admin-secondary:hover:not(:disabled) { background-color: #334155; }
      html.light-theme .btn-admin-secondary { background-color: #d1d5db; color: #1f2937; }
      html.light-theme .btn-admin-secondary:hover:not(:disabled) { background-color: #9ca3af; }

      .btn-admin-close { color: var(--text-secondary); background: transparent; }
      .btn-admin-close:hover { color: var(--text-primary); }
      html.light-theme .btn-admin-close { color: #9ca3af; }
      html.light-theme .btn-admin-close:hover { color: #374151; }


      /* Light theme specific overrides for tailwind classes */
      html.light-theme .text-white { color: var(--text-primary); }
      html.light-theme .hover\:text-white:hover { color: var(--text-primary); }
      html.light-theme .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1); }
      html.light-theme .bg-slate-700 { background-color: #e5e7eb; color: var(--text-primary); }
      html.light-theme .text-slate-700 { color: #cbd5e1; /* slate-300 */ }
      html.light-theme input::placeholder, html.light-theme textarea::placeholder { color: var(--text-secondary); }
      html.light-theme .border-slate-600 { border-color: #d1d5db; }
      html.light-theme .bg-slate-900\/50 { background-color: rgba(226, 232, 240, 0.5); }
    </style>
    <!-- React, Babel, and Three.js -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    "react": "https://aistudiocdn.com/react@^19.2.0",

  </head>
  <body>
    <div id="preloader"><div class="loader-shape"></div></div>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
